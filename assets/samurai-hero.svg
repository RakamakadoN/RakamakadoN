<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
<title id="title">Diyaz Seisenbayev — Samurai-inspired developer showcase</title>
<desc id="description">An empty ceremonial samurai armor and katana under a crimson moon. Gold inscriptions and a dark cinematic backdrop frame the name Diyaz Seisenbayev. The light on the sword, embers, and moon pulse subtly.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b11"/><stop offset=".48" stop-color="#0e1420"/><stop offset="1" stop-color="#13131b"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#ce402c" stop-opacity=".48"/><stop offset=".55" stop-color="#8e1e2b" stop-opacity=".27"/><stop offset="1" stop-color="#58131f" stop-opacity="0"/></radialGradient>
  <radialGradient id="moon"><stop stop-color="#a83a3d"/><stop offset=".68" stop-color="#8e202d"/><stop offset="1" stop-color="#45101d"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0cf82"/><stop offset=".2" stop-color="#9f7b43"/><stop offset=".48" stop-color="#412d24"/><stop offset=".77" stop-color="#d9b875"/><stop offset="1" stop-color="#5c432b"/></linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#39404a"/><stop offset=".22" stop-color="#111923"/><stop offset=".56" stop-color="#20252e"/><stop offset="1" stop-color="#080c12"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe7e5"/><stop offset=".28" stop-color="#f9f5db"/><stop offset=".42" stop-color="#64717b"/><stop offset="1" stop-color="#111720"/></linearGradient>
  <linearGradient id="bladeLight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff9c7" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b99760" opacity=".11"/></pattern>
  <pattern id="lamella" width="18" height="32" patternUnits="userSpaceOnUse"><path d="M1 0V26Q9 33 17 26V0" fill="none" stroke="#b99551" opacity=".42"/><circle cx="9" cy="7" r="1.6" fill="#d3a567" opacity=".7"/></pattern>
  <clipPath id="bladeClip"><path d="M497 333 Q732 311 1060 301 L1060 310 Q732 324 497 333Z"/></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#02040a" flood-opacity=".8"/></filter>
  <style>
    .aura{transform-origin:985px 180px;animation:breathe 6s ease-in-out infinite}
    .shine{animation:shimmer 5.5s ease-in-out infinite}
    .ember1{animation:float1 5.8s ease-in-out infinite}
    .ember2{animation:float2 6.8s ease-in-out infinite}
    .ember3{animation:float1 8.2s ease-in-out infinite reverse}
    .gold{animation:goldPulse 5s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.68;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes shimmer{0%,10%{transform:translateX(-700px);opacity:0}24%{opacity:.8}48%{transform:translateX(680px);opacity:.95}55%,100%{transform:translateX(680px);opacity:0}}
    @keyframes float1{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(12px,-30px);opacity:.8}}
    @keyframes float2{0%,100%{transform:translate(0,0);opacity:.12}50%{transform:translate(-19px,-23px);opacity:.65}}
    @keyframes goldPulse{0%,100%{opacity:.65}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
